{{define "raw"}}{{template "head" .}}
<p class="muted">The payload posts unchanged to the selected create endpoint, for requests the start form cannot express.</p>
<form method="post" action="/raw">
<fieldset>
<legend>Request</legend>
<label for="raw-target">Target</label>
<select id="raw-target" name="target">
<option value="clerk"{{if eq .Target "clerk"}} selected{{end}}>clerk /clerk/v1/cases</option>
<option value="direct"{{if eq .Target "direct"}} selected{{end}}>direct /api/v1/cases</option>
</select>
<label for="raw-payload">JSON payload</label>
<textarea id="raw-payload" name="payload" rows="18" spellcheck="false">{{.Payload}}</textarea>
</fieldset>
<button type="submit">send</button>
</form>
{{if .Status}}
<h2>HTTP {{.Status}}</h2>
<pre>{{.Response}}</pre>
{{end}}
{{template "foot" .}}{{end}}
