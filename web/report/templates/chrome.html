{{define "head"}}<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>{{.Title}}</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/sort.js" defer></script>
{{if .Refresh}}<meta http-equiv="refresh" content="{{.Refresh}}">{{end}}
</head>
<body>
<h1>{{.Heading}}</h1>
{{if .Crumbs}}<p>{{range $i, $c := .Crumbs}}{{if $i}} / {{end}}{{if $c.Href}}<a href="{{$c.Href}}">{{$c.Text}}</a>{{else}}{{$c.Text}}{{end}}{{end}} | {{.Now}}</p>{{end}}
{{end}}

{{define "foot"}}</body>
</html>
{{end}}
